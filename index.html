<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peninsula Disc Golf Club</title>
  <meta name="description" content="Peninsula Disc Golf Club — Coming Soon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://d2xsxph8kpxj0f.cloudfront.net/310519663521680723/4LmVc63AAJJPPDnm7ZNEvC/action-throw-8i7pxpEA3rThZDTMFnR7Xm.webp');
      background-size: cover;
      background-position: center center;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 25, 15, 0.45) 0%,
        rgba(10, 25, 15, 0.65) 100%
      );
      z-index: 1;
    }

    .content {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .club-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: clamp(1rem, 3vw, 1.3rem);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #b5d44a;
      margin-bottom: 1rem;
    }

    .coming-soon {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 15vw, 10rem);
      text-transform: uppercase;
      line-height: 0.9;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #b5d44a;
      margin: 2rem auto;
      border-radius: 2px;
    }

    .tagline {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.05em;
    }

    .email {
      margin-top: 2.5rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.5);
    }

    .email a {
      color: #b5d44a;
      text-decoration: none;
      transition: color 0.2s;
    }

    .email a:hover { color: #ffffff; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="logo-icon">🥏</div>
    <div class="club-name">Peninsula Disc Golf Club</div>
    <div class="coming-soon">Coming<br>Soon</div>
    <div class="divider"></div>
    <div class="tagline">Something great is on its way.</div>
    <div class="email">Questions? <a href="mailto:peninsuladiscgolf@gmail.com">peninsuladiscgolf@gmail.com</a></div>
  </div>
</body>
</html>
