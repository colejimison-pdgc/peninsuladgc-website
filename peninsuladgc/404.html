<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Peninsula Disc Golf Club</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--forest-dark);
      color: white;
    }
    .not-found .disc { font-size: 5rem; margin-bottom: 1rem; animation: spin 3s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .not-found h1 { font-family: var(--font-display); font-weight: 900; font-size: 6rem; color: var(--lime); margin: 0; line-height: 1; }
    .not-found p { color: rgba(255,255,255,0.6); margin: 1rem 0 2rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="disc">🥏</div>
    <h1>404</h1>
    <p>Looks like that disc flew out of bounds.<br>Let's get you back on the fairway.</p>
    <a href="/" class="btn btn-primary">Back to Home →</a>
  </div>
</body>
</html>
